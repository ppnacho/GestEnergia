<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Energética | Control Integral</title>
    <!-- Tailwind CSS CDN para un diseño moderno y rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="assets/img/gestenergia.png">
    <link rel="apple-touch-icon" sizes="1024x1024" href="assets/img/gestenergia.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-header {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col justify-between selection:bg-emerald-500 selection:text-white">

    <!-- HERO SECTION CON IMAGEN DE FONDO Y EFECTO DINÁMICO -->
    <div class="relative min-h-screen flex flex-col justify-between overflow-hidden">
        
        <!-- Imagen de fondo optimizada con capa de opacidad y gradiente -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1473341304170-971dccb5ac1e?auto=format&fit=crop&q=80&w=2000" 
                 alt="Gestión Energética" 
                 class="w-full h-full object-cover object-center scale-105 animate-pulse duration-[10000ms]">
            <div class="absolute inset-0 bg-gradient-to-tr from-slate-950 via-slate-950/80 to-slate-900/60"></div>
        </div>

        <!-- HEADER / NAVEGACIÓN -->
        <header class="relative z-10 w-full border-b border-slate-800/60 glass-header transition-all duration-300">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <!-- Logotipo / Marca -->
                <a href="index.html" class="flex items-center gap-3 group">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                        <svg class="w-5 h-5 text-slate-950" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                    </div>
                </a>

                <!-- Menú de navegación (2 opciones exactas) -->
                <nav class="flex items-center gap-2 sm:gap-4">
                    <a href="./suministros/suministros.html" 
                       class="px-4 py-2 rounded-lg text-sm font-medium text-slate-300 hover:text-white hover:bg-slate-800/50 transition-all duration-200">
                        Suministros
                    </a>
                    
                    <!-- Enlace directo de acceso protegido a login.html -->
                    <a href="login.html" 
                       class="relative group overflow-hidden rounded-lg p-px font-medium text-sm focus:outline-none shadow-lg shadow-emerald-900/20 inline-block">
                        <span class="absolute inset-0 bg-gradient-to-r from-emerald-500 to-teal-400 transition-all duration-300 group-hover:opacity-90"></span>
                        <span class="relative px-4 py-2 rounded-[7px] bg-slate-950/80 flex items-center gap-2 text-emerald-400 group-hover:text-white transition-colors duration-200">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                            Panel Privado
                        </span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL / HERO -->
        <main class="relative z-10 max-w-7xl mx-auto px-6 py-20 my-auto flex flex-col items-start max-w-3xl">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 text-xs font-semibold tracking-wide uppercase mb-6 animate-bounce duration-1000">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                Control Energético Inteligente
            </div>
            
            <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-[1.1] mb-6">
                Optimiza el consumo de <span class="bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-teal-300">agua, luz y gas</span>.
            </h1>
            
            <p class="text-lg sm:text-xl text-slate-400 font-light mb-10 max-w-2xl leading-relaxed">
                Plataforma centralizada para la monitorización de suministros, almacenamiento digital de facturas y análisis detallado de costes energéticos.
            </p>
        </main>

        <!-- FOOTER DISCRETO -->
        <footer class="relative z-10 w-full border-t border-slate-900 bg-slate-950/60 py-6">
            <div class="max-w-7xl mx-auto px-6 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-500 gap-4">
                <p>&copy; 2026 Gestor Energético. Todos los derechos reservados.</p>
            </div>
        </footer>

    </div>

    <!-- Script modular asociado -->
    <script src="index.js"></script>
</body>
</html>
