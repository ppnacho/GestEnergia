<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestEnergética - Panel de Control</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-emerald-600/20">
                    ⚡
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">GestEnergética</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <button id="btn-logout" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-200">
                    Cerrar Sesión
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Tarjeta de Bienvenida con Botones de Carga en columna vertical a la derecha -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 rounded-2xl p-6 sm:p-8 text-white shadow-xl shadow-emerald-900/10 mb-8 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-6">
            <div>
                <h2 class="text-2xl sm:text-3xl font-bold mb-2">¡Bienvenido al Panel de Control!</h2>
                <p class="text-emerald-100 max-w-2xl text-sm sm:text-base">
                    Sistema de gestión y monitorización energética avanzado. Aquí podrás supervisar tus suministros, consumos y estados en tiempo real.
                </p>
            </div>
            
            <!-- Grupo de botones apilados verticalmente, alineados a la derecha y con ancho uniforme -->
            <div class="flex-shrink-0 flex flex-col items-stretch sm:items-end space-y-3 w-full sm:w-auto">
                <a href="../load/loadcsv.html" class="bg-white text-emerald-700 hover:bg-emerald-50 px-5 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-md inline-flex items-center justify-center text-center w-full sm:w-52">
                    <span>CargaCSV</span>
                </a>
                <a href="../load/cargatarifas.html" class="bg-white text-emerald-700 hover:bg-emerald-50 px-5 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-md inline-flex items-center justify-center text-center w-full sm:w-52">
                    <span>CargaTarifas</span>
                </a>
                <a href="../load/cargafacturas.html" class="bg-white text-emerald-700 hover:bg-emerald-50 px-5 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-md inline-flex items-center justify-center text-center w-full sm:w-52">
                    <span>CargaFacturas</span>
                </a>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            GestEnergética &copy; 2026 - Todos los derechos reservados.
        </div>
    </footer>

    <!-- Script modularizado -->
    <script type="module" src="../assets/js/gestenergetica.js"></script>
</body>
</html>
