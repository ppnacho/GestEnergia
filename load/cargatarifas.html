<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestEnergética - Carga de Tarifas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
    body { font-family: 'Inter', sans-serif; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }
    input[type=number] {
        -moz-appearance: textfield;
    }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-emerald-600/20">
                    ⚡
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">GestEnergética</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <a href="../gestion/gestenergetica.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-200 inline-flex items-center space-x-2">
                    <span>← Volver al Panel</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal: Dos Columnas -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex flex-col lg:flex-row gap-8 items-stretch">
            
            <!-- Columna Izquierda: Formulario (ancho proporcional aprox 58%) -->
            <div class="w-full lg:w-7/12 bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 flex flex-col">
                <div class="bg-gradient-to-r from-emerald-600 to-teal-700 px-6 py-5 text-white flex justify-between items-center rounded-t-2xl">
                    <div>
                        <h2 class="text-xl font-bold" id="formTitle">Carga de Tarifa Eléctrica</h2>
                        <p class="text-emerald-100 text-sm mt-1">Parámetros de periodos y costes fijos.</p>
                    </div>
                    <button type="button" id="btnNueva" class="hidden bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                        Cancelar
                    </button>
                </div>

                <form id="tarifaForm" class="p-6 space-y-4 flex-grow flex flex-col justify-between">
                    <input type="hidden" id="tarifaId">
                    
                    <div class="space-y-4">
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">CUPS</label>
                                <input type="text" id="suministro" required placeholder="ESXXXXXXXXXXXXXXXXXX" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm">
                            </div>

                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Tarifa</label>
                                <input type="text" id="nombre" required placeholder="Ej: Tarifa 2.0TD" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none text-sm">
                            </div>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-600 mb-1">Punta (€/kWh)</label>
                                <input type="number" step="0.0000001" id="punta" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-600 mb-1">Llano (€/kWh)</label>
                                <input type="number" step="0.0000001" id="llano" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-600 mb-1">Valle (€/kWh)</label>
                                <input type="number" step="0.0000001" id="valle" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-[11px] font-medium text-slate-600 mb-1">Excedente</label>
                                <input type="number" step="0.0000001" id="excedente" required placeholder="0.00" class="w-full px-3 py-2 rounded-xl border border-slate-300 text-sm">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Fijo Punta (€/kW)</label>
                                <input type="number" step="0.0000001" id="fijo_punta" required placeholder="0.00" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Fijo Valle (€/kW)</label>
                                <input type="number" step="0.0000001" id="fijo_valle" required placeholder="0.00" class="w-full px-3.5 py-2 rounded-xl border border-slate-300 text-sm">
                            </div>
                        </div>

                        <!-- Ticks de Estado -->
                        <div class="flex flex-col sm:flex-row sm:items-center space-y-2 sm:space-y-0 sm:space-x-6 p-3 bg-slate-50 rounded-xl border border-slate-200">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="activa" class="w-4 h-4 text-emerald-600 rounded border-slate-300">
                                <span class="text-xs font-medium text-slate-700">Tarifa Activa (Exclusiva)</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" id="compara" class="w-4 h-4 text-sky-600 rounded border-slate-300">
                                <span class="text-xs font-medium text-slate-700">Incluir en Comparativa</span>
                            </label>
                        </div>

                        <div id="formMessage" class="text-xs font-medium hidden p-3 rounded-lg"></div>
                    </div>

                    <div class="flex justify-end pt-4 border-t border-slate-100 mt-4">
                        <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-md shadow-emerald-600/20">
                            Guardar Tarifa
                        </button>
                    </div>
                </form>
            </div>

            <!-- Columna Derecha: Listado de Tarifas (ancho proporcional aprox 42%) -->
            <div class="w-full lg:w-5/12 bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 flex flex-col">
                <div class="px-6 py-5 border-b border-slate-200 flex justify-between items-center bg-slate-50/50 rounded-t-2xl">
                    <h3 class="font-bold text-slate-900 text-sm">Tarifas Registradas</h3>
                    <span id="contadorTarifas" class="text-xs bg-slate-200/70 text-slate-700 px-2.5 py-1 rounded-full font-semibold">0 tarifas</span>
                </div>
                
                <!-- Contenedor con scroll interno que llena exactamente el espacio restante -->
                <div class="flex-grow overflow-y-auto" style="max-height: 480px;">
                    <table class="w-full text-left border-collapse">
                        <thead class="sticky top-0 bg-white z-10 shadow-sm">
                            <tr class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider border-b border-slate-200">
                                <th class="py-3 px-4">Tarifa / Alias</th>
                                <th class="py-3 px-4">Fecha</th>
                                <th class="py-3 px-4 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tarifasTableBody" class="divide-y divide-slate-100 text-xs">
                            <tr>
                                <td colspan="3" class="text-center py-6 text-slate-400">Cargando tarifas...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            GestEnergética &copy; 2026 - Todos los derechos reservados.
        </div>
    </footer>

    <!-- Script modularizado -->
    <script type="module" src="../assets/js/cargatarifas.js"></script>
</body>
</html>
