<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestTelefonía - Carga de Asociados</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Ocultar flechas de incremento/decremento en inputs numéricos */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-emerald-600/20">
                    📱
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">GestTelefonía</h1>
            </div>
            
            <div class="flex items-center space-x-3">
                <button id="btn-volver" onclick="window.location.href='../gestion/gesttelefono.html'" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-200 inline-flex items-center space-x-2">
                    <span>← Volver</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden">
            <!-- Cabecera temática Telefonía -->
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 px-6 py-5 text-white">
                <h2 class="text-xl font-bold">Carga de Líneas Asociadas</h2>
                <p class="text-emerald-100 text-sm mt-1">Registra los importes facturados e ingresos correspondientes a cada línea asociada.</p>
            </div>

            <form id="form-asociados-telefono" class="p-6 sm:p-8 space-y-6">
                
                <!-- Fila 1: Fecha Factura y Línea -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <div>
                        <label for="input-fecha-factura" class="block text-sm font-medium text-slate-700 mb-1">Fecha de Factura</label>
                        <input type="date" id="input-fecha-factura" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm bg-white">
                    </div>

                    <div>
                        <label for="input-linea" class="block text-sm font-medium text-slate-700 mb-1">Línea (9 cifras)</label>
                        <input type="text" id="input-linea" required maxlength="9" pattern="[0-9]{9}" inputmode="numeric" placeholder="Ej: 600123456" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                    </div>
                </div>

                <!-- Fila 2: Desglose de Facturación -->
                <div class="pt-2 border-t border-slate-100">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Desglose de Facturación</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-4">
                        <div>
                            <label for="input-precio-base" class="block text-sm font-medium text-slate-700 mb-1">Precio Base (€)</label>
                            <input type="number" step="0.01" id="input-precio-base" required placeholder="0.00" class="calc-total w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                        </div>

                        <div>
                            <label for="input-consumo-extra" class="block text-sm font-medium text-slate-700 mb-1">Consumo Extra (€)</label>
                            <input type="number" step="0.01" id="input-consumo-extra" value="0.00" required class="calc-total w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                        </div>

                        <div>
                            <label for="input-iva-pct" class="block text-sm font-medium text-slate-700 mb-1">IVA (%)</label>
                            <input type="number" step="0.01" id="input-iva-pct" value="21" required class="calc-total w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                        </div>

                        <div>
                            <label for="input-total" class="block text-sm font-medium text-emerald-700 mb-1">Total Factura (€)</label>
                            <input type="number" step="0.01" id="input-total" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-emerald-300 bg-emerald-50/40 font-semibold text-slate-900 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                        </div>
                    </div>
                </div>

                <!-- Fila 3: Ingresos Asociados -->
                <div class="pt-2 border-t border-slate-100">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4">Ingresos Asociados (€)</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                        <div>
                            <label for="input-ingreso-linea" class="block text-sm font-medium text-slate-700 mb-1">Ingreso Línea (€)</label>
                            <input type="number" step="0.01" id="input-ingreso-linea" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                        </div>

                        <div>
                            <label for="input-ingreso-extras" class="block text-sm font-medium text-slate-700 mb-1">Ingreso Extras (€)</label>
                            <input type="number" step="0.01" id="input-ingreso-extras" value="0.00" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                        </div>
                    </div>
                </div>

                <!-- Mensajes de Estado / Error -->
                <div id="upload-status" class="hidden text-sm font-medium p-3 rounded-lg"></div>

                <!-- Botón de Envío -->
                <div class="flex justify-end pt-4 border-t border-slate-100">
                    <button type="submit" id="btn-submit-asociado" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-md shadow-emerald-600/20">
                        Guardar Registro
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            GestTelefonía &copy; 2026 - Todos los derechos reservados.
        </div>
    </footer>

    <!-- Script modular JS -->
    <script type="module" src="../assets/js/cargaasociados_telefono.js"></script>
</body>
</html>
