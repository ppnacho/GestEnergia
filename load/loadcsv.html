<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestEnergética - Carga CSV</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-emerald-600/20">
                    ⚡
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">GestEnergética</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <a href="../gestion/gestenergetica.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-200 inline-flex items-center space-x-2">
                    <span>← Volver</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Tarjeta Principal de Carga -->
        <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm mb-8">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Carga de Ficheros CSV</h2>
            <p class="text-slate-500 text-sm mb-6">
                Selecciona un archivo CSV con los registros de consumos y generación para procesarlo y cargarlo automáticamente en el sistema.
            </p>

            <!-- Formulario de Selección y Envío -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
                <div class="flex-grow">
                    <input type="file" id="csv-file-input" accept=".csv" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2.5 file:px-4
                        file:rounded-xl file:border-0
                        file:text-sm file:font-semibold
                        file:bg-emerald-50 file:text-emerald-700
                        hover:file:bg-emerald-100 cursor-pointer border border-slate-200 rounded-xl p-1.5 bg-slate-50"
                    >
                </div>
                <div>
                    <button id="btn-upload-csv" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-semibold text-sm transition-colors shadow-md shadow-emerald-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
                        Procesar y Cargar
                    </button>
                </div>
            </div>

            <!-- Información del último periodo registrado -->
            <div id="info-ultimo-periodo" class="mt-4 p-3 bg-blue-50/50 border border-blue-100 rounded-xl text-xs text-blue-900 flex items-center space-x-2">
                <span class="font-semibold">📅 Último periodo en BD:</span>
                <span id="texto-ultimo-periodo" class="text-blue-700">Comprobando...</span>
            </div>

            <!-- Área de Estado / Mensajes -->
            <div id="upload-status" class="mt-6 hidden p-4 rounded-xl text-sm"></div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            GestEnergética &copy; 2026 - Todos los derechos reservados.
        </div>
    </footer>

    <!-- Script modularizado ubicado en assets/js/loadcsv.js -->
    <script type="module" src="../assets/js/loadcsv.js"></script>
</body>
</html>
