<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestEnergética - Carga de Facturas</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Ocultar flechas de incremento/decremento en inputs numéricos */
        input[type=number]::-webkit-outer-spin-button,
        input[type=number]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-emerald-600/20">
                    ⚡
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">GestEnergética</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <a href="../gestion/gestenergetica.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-200 inline-flex items-center space-x-2">
                    <span>← Volver al Panel</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="bg-white rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-200 overflow-hidden">
            <div class="bg-gradient-to-r from-emerald-600 to-teal-700 px-6 py-5 text-white">
                <h2 class="text-xl font-bold">Carga de Facturas Mensuales</h2>
                <p class="text-emerald-100 text-sm mt-1">Introduce los datos de la factura para calcular automáticamente el wallet y los importes de pago.</p>
            </div>

            <form id="form-factura" class="p-6 sm:p-8 space-y-6">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Suministro (Selector por Alias) -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Suministro</label>
                        <select id="select-suministro" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm bg-white">
                            <option value="">Cargando suministros...</option>
                        </select>
                    </div>

                    <!-- Mes (Formato mmmaa) -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Mes de Facturación</label>
                        <select id="select-mes" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm bg-white">
                            <!-- Rellenado dinámicamente desde JS -->
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Coste Energía -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Coste Energía (€)</label>
                        <input type="number" step="0.01" id="input-coste-energia" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                    </div>

                    <!-- Excedentes Generados -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Excedentes Generados (€)</label>
                        <input type="number" step="0.01" id="input-excedentes" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Total Coste -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Total Coste (€)</label>
                        <input type="number" step="0.01" id="input-total-coste" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                    </div>

                    <!-- Total Impuestos -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Total Impuestos (€)</label>
                        <input type="number" step="0.01" id="input-total-impuestos" required placeholder="0.00" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all text-sm">
                    </div>
                </div>

                <!-- Mensajes de Estado / Error -->
                <div id="upload-status" class="hidden text-sm font-medium p-3 rounded-lg"></div>

                <!-- Botón de Envío -->
                <div class="flex justify-end pt-4 border-t border-slate-100">
                    <button type="submit" id="btn-submit-factura" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition-colors shadow-md shadow-emerald-600/20">
                        Guardar Factura
                    </button>
                </div>

            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            GestEnergética &copy; 2026 - Todos los derechos reservados.
        </div>
    </footer>

    <!-- Script modular JS -->
    <script type="module" src="../assets/js/cargafacturas.js"></script>
</body>
</html>
