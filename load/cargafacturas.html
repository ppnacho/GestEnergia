<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Facturas - Panel Energético</title>
    <!-- Tailwind CSS (según diseño estándar del proyecto) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <div class="max-w-xl mx-auto w-full p-6 bg-white shadow-md rounded-lg my-10">
        <h1 class="text-2xl font-bold mb-6 text-gray-900 border-b pb-2">Carga y Registro de Facturas</h1>

        <!-- Estado / Alertas -->
        <div id="upload-status" class="hidden p-4 mb-4 rounded-md text-sm"></div>

        <form id="form-factura" class="space-y-4">
            <!-- Suministro (Selector por Alias) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Suministro</label>
                <select id="select-suministro" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="">Cargando suministros...</option>
                </select>
            </div>

            <!-- Mes (Formato mmmaa) -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Mes de Facturación</label>
                <select id="select-mes" required class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <!-- Se rellenará dinámicamente desde JS -->
                </select>
            </div>

            <!-- Coste Energía -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Coste Energía (€)</label>
                <input type="number" step="0.01" id="input-coste-energia" required placeholder="0.00" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Excedentes Generados -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Excedentes Generados (€)</label>
                <input type="number" step="0.01" id="input-excedentes" required placeholder="0.00" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Total Coste -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Total Coste (€)</label>
                <input type="number" step="0.01" id="input-total-coste" required placeholder="0.00" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <!-- Total Impuestos -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Total Impuestos (€)</label>
                <input type="number" step="0.01" id="input-total-impuestos" required placeholder="0.00" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>

            <button type="submit" id="btn-submit-factura" class="w-full bg-blue-600 text-white font-medium py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200">
                Guardar Factura
            </button>
        </form>
    </div>

    <!-- Script modular JS -->
    <script type="module" src="../assets/js/cargafacturas.js"></script>
</body>
</html>
