<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestAgua - Carga de Ficheros CSV</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header / Barra Superior -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-cyan-600 flex items-center justify-center text-white font-bold text-xl shadow-md shadow-cyan-600/20">
                    💧
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">GestAgua</h1>
            </div>
            
            <div class="flex items-center space-x-4">
                <a href="../gestion/gestagua.html" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-slate-200 inline-flex items-center space-x-2">
                    <span>← Volver</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-grow max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
        
        <!-- Tarjeta: Carga de Ficheros CSV de Agua -->
        <div class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm mb-6">
            <h2 class="text-xl font-bold text-slate-900 mb-2">Carga de Ficheros CSV (Consumo de Agua)</h2>
            <p class="text-slate-500 text-sm mb-6">
                Selecciona tu archivo CSV de consumos de agua para procesarlo y cargarlo automáticamente en la base de datos.
            </p>

            <!-- Formulario CSV -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-4">
                <div class="flex-grow">
                    <input type="file" id="csv-agua-file-input" accept=".csv" class="block w-full text-sm text-slate-500
                        file:mr-4 file:py-2.5 file:px-4
                        file:rounded-xl file:border-0
                        file:text-sm file:font-semibold
                        file:bg-cyan-50 file:text-cyan-700
                        hover:file:bg-cyan-100 cursor-pointer border border-slate-200 rounded-xl p-1.5 bg-slate-50"
                    >
                </div>
                <div>
                    <button id="btn-upload-csv-agua" class="w-full sm:w-auto bg-cyan-600 hover:bg-cyan-700 text-white px-6 py-3 rounded-xl font-semibold text-sm transition-colors shadow-md shadow-cyan-600/20 disabled:opacity-50 disabled:cursor-not-allowed">
                        Procesar CSV
                    </button>
                </div>
            </div>
        </div>

        <!-- Información del último periodo registrado en consumos_agua -->
        <div id="info-ultimo-periodo-agua" class="mt-4 p-3 bg-cyan-50/50 border border-cyan-100 rounded-xl text-xs text-cyan-900 flex items-center space-x-2">
            <span class="font-semibold">📅 Último registro en BD:</span>
            <span id="texto-ultimo-periodo-agua" class="text-cyan-700">Comprobando...</span>
        </div>

        <!-- Área de Estado / Mensajes -->
        <div id="upload-status-agua" class="mt-6 hidden p-4 rounded-xl text-sm"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            GestAgua &copy; 2026 - Todos los derechos reservados.
        </div>
    </footer>

    <!-- Script modularizado para procesar el CSV de agua -->
    <script type="module" src="../assets/js/loadcsv_agua.js"></script>
</body>
</html>
