<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tarifas con Batería Virtual · CD Veteranos Ajalvir</title>

    <link rel="stylesheet" href="assets/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        .tarifas-container {
            max-width: 1100px;
            margin: 0 auto;
        }
        /* Card principal con scroll para la lista de tarifas filtradas */
        .card-tarifas-scroll {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1.5rem;
            max-height: 600px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        /* Cada tarjeta individual de tarifa */
        .tarifa-item-card {
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 1rem 1.25rem;
            display: grid;
            grid-template-columns: 2fr repeat(6, 1fr);
            gap: 0.75rem;
            align-items: center;
        }
        .tarifa-titulo-completo {
            grid-column: 1 / -1;
            font-size: 1rem;
            font-weight: bold;
            color: #38bdf8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
            margin-bottom: 0.25rem;
        }
        .tarifa-campo {
            display: flex;
            flex-direction: column;
        }
        .tarifa-campo label {
            font-size: 0.60rem;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .tarifa-campo span {
            font-size: 0.85rem;
            color: #fff;
            font-weight: 500;
        }
        .loading {
            color: #38bdf8;
            font-style: italic;
            text-align: center;
            padding: 2rem;
        }
        .error {
            color: #ef4444;
            text-align: center;
            padding: 2rem;
        }
        @media (max-width: 900px) {
            .tarifa-item-card {
                grid-template-columns: repeat(2, 1fr);
            }
            .tarifa-titulo-completo {
                grid-column: 1 / -1;
            }
        }
    </style>
</head>

<body>

    <header class="site-header">
        <nav class="navbar container">
            <a class="brand" href="index.html">
                <span class="brand-logo">
                    <img src="assets/img/escudo-cdv-ajalvir.jpg" alt="Escudo CD Veteranos Ajalvir">
                </span>
                <span>CD Veteranos Ajalvir</span>
            </a>
            <button class="nav-toggle" data-nav-toggle>☰</button>
            <div class="nav-links" data-nav-links></div>
        </nav>
    </header>

    <main class="container" style="padding-top: 2rem; padding-bottom: 3rem;">

        <section class="page-hero" style="text-align: center; margin-bottom: 2rem;">
            <p class="eyebrow">Optimización Energética</p>
            <h1>Tarifas con Batería Virtual Activa</h1>
            <p class="lead">Listado de tarifas del mercado filtradas con saldo o precio de BV superior a 0.</p>
        </section>

        <div class="tarifas-container">
            <div id="resultado" class="card-tarifas-scroll loading">
                Cargando y filtrando tarifas...
            </div>
        </div>

    </main>

    <footer class="site-footer">
        <div class="container footer-grid" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap;">
                <p style="margin: 0;">© 2026 CD Veteranos Ajalvir</p>
                <div class="footer-links" style="display: flex; gap: 0.75rem; align-items: center; margin: 0;">
                    <a href="https://www.instagram.com/cdveteranosajalvir?igsh=MXN6NDMxZmhhOTVlcQ%3D%3D" target="_blank" class="social-link instagram" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://facebook.com/people/CD-Veteranos-Ajalvir/100054549756163/" target="_blank" class="social-link facebook" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="mailto:cdve.ajalvir@gmail.com" class="social-link mail" aria-label="Correo electrónico"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
            <div>
                <a href="pprivacidad.html" style="color: inherit; text-decoration: underline; font-size: 0.9rem; white-space: nowrap;">Política de privacidad</a>
            </div>
        </div>
    </footer>

    <script src="assets/js/tarifasweb.js"></script>

</body>

</html>
